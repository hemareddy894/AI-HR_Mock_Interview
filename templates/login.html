<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | AI Mock HR Interview</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.login-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
.login-card { width: min(100%, 430px); padding: 2.5rem; text-align: center; }
.login-mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 1.5rem; border-radius: 18px; background: linear-gradient(135deg, var(--accent1), var(--accent3)); color: #fff; font-size: 1.7rem; box-shadow: 0 8px 30px rgba(108,99,255,0.35); }
.login-card h1 { font-size: 1.8rem; margin-bottom: 0.65rem; }
.login-card p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.8rem; }
.login-form { text-align: left; }
.login-form label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; }
.login-form input { width: 100%; padding: 0.9rem 1rem; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); background: rgba(255,255,255,0.06); color: var(--text-primary); font: inherit; outline: none; }
.login-form input:focus { border-color: var(--accent3); box-shadow: 0 0 0 3px rgba(56,189,248,0.12); }
.login-form .btn { width: 100%; justify-content: center; margin-top: 1.2rem; }
.login-error { margin-bottom: 1rem; padding: 0.75rem 1rem; border: 1px solid rgba(248,113,113,0.4); border-radius: var(--radius-sm); color: #fca5a5; background: rgba(248,113,113,0.1); font-size: 0.85rem; }
.login-note { margin: 1.25rem 0 0 !important; font-size: 0.78rem; color: var(--text-muted) !important; }
</style>
</head>
<body>
<div class="bg-animated"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<main class="login-page">
  <section class="glass login-card">
    <div class="login-mark"><i class="fas fa-graduation-cap"></i></div>
    <h1>Student Login</h1>
    <p>Enter your Gmail address to access your personalized interview workspace.</p>
    {% if error %}<div class="login-error" role="alert"><i class="fas fa-circle-exclamation"></i> {{ error }}</div>{% endif %}
    <form class="login-form" method="post" action="{{ url_for('main.login') }}">
      <label for="email">Gmail address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="student@gmail.com" required autofocus>
      <button class="btn btn-primary" type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Continue</button>
    </form>
    <p class="login-note">Your interview history is linked to this email on this application.</p>
  </section>
</main>
</body>
</html>
